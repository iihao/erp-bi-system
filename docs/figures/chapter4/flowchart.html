<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: transparent;
      display: flex;
      justify-content: center;
    }
    .mermaid {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div class="mermaid">
flowchart TD
    A([开始]) --> B[识别数据源与增量范围]
    B --> C[抽取原始数据到 ODS]
    C --> D[执行字段映射与类型转换]
    D --> E[去重、空值处理、编码统一]
    E --> F{质量校验通过？}
    F -- 否 --> G[记录异常并触发重试]
    G --> Z([结束])
    F -- 是 --> H[加载到 DWD 明细层]
    H --> I[按主题聚合形成 DWS]
    I --> J[生成 ADS 报表数据集]
    J --> K[刷新报表与 AI 问数底座]
    K --> L[写入执行日志与监控指标]
    L --> Z([结束])
  </div>
  <script>
    mermaid.initialize({ 
      startOnLoad: true,
      theme: 'base',
      themeVariables: {
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        fontSize: '16px'
      }
    });
  </script>
</body>
</html>
