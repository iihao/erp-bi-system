<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90D9"/>
    </marker>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F1F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0E0F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF4E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE5CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F8F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1F2EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF9E7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDF2C9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="extGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4ECF7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9DAF1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">AI数据融合平台架构图</text>

  <!-- User Layer -->
  <rect x="50" y="60" width="900" height="90" rx="10" fill="url(#userGrad)" stroke="#4A90D9" stroke-width="2"/>
  <text x="75" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E5C8A">🖥️ 用户层</text>

  <rect x="100" y="95" width="200" height="45" rx="5" fill="white" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Vue3 前端</text>
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">仪表板/报表/AI 问数</text>

  <rect x="350" y="95" width="200" height="45" rx="5" fill="white" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="450" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Metabase BI</text>
  <text x="450" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">自助分析/拖拽报表</text>

  <rect x="600" y="95" width="200" height="45" rx="5" fill="white" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="700" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">REST API</text>
  <text x="700" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">外部系统调用</text>

  <!-- App Layer -->
  <rect x="50" y="170" width="900" height="120" rx="10" fill="url(#appGrad)" stroke="#E67E22" stroke-width="2"/>
  <text x="75" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D35400">⚙️ 应用层 - FastAPI</text>

  <rect x="100" y="205" width="150" height="40" rx="5" fill="white" stroke="#E67E22" stroke-width="1.5"/>
  <text x="175" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">API 网关</text>

  <rect x="270" y="205" width="120" height="40" rx="5" fill="white" stroke="#E67E22" stroke-width="1.5"/>
  <text x="330" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">认证服务</text>

  <rect x="410" y="205" width="120" height="40" rx="5" fill="white" stroke="#E67E22" stroke-width="1.5"/>
  <text x="470" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">查询引擎</text>

  <rect x="550" y="205" width="150" height="40" rx="5" fill="white" stroke="#E67E22" stroke-width="1.5"/>
  <text x="625" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">AI 问数服务</text>
  <text x="625" y="240" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">百炼 Qwen3.5</text>

  <rect x="720" y="205" width="120" height="40" rx="5" fill="white" stroke="#E67E22" stroke-width="1.5"/>
  <text x="780" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">报表服务</text>

  <!-- Data Layer -->
  <rect x="50" y="310" width="900" height="220" rx="10" fill="url(#dataGrad)" stroke="#1ABC9C" stroke-width="2"/>
  <text x="75" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16A085">💾 数据层</text>

  <!-- MySQL -->
  <ellipse cx="150" cy="380" rx="60" ry="35" fill="white" stroke="#1ABC9C" stroke-width="1.5"/>
  <text x="150" y="375" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">MySQL</text>
  <text x="150" y="390" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">业务数据库</text>

  <!-- Redis -->
  <ellipse cx="300" cy="380" rx="50" ry="35" fill="white" stroke="#1ABC9C" stroke-width="1.5"/>
  <text x="300" y="375" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Redis</text>
  <text x="300" y="390" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">缓存</text>

  <!-- Data Warehouse Box -->
  <rect x="420" y="350" width="500" height="160" rx="8" fill="url(#dwGrad)" stroke="#F39C12" stroke-width="2"/>
  <text x="670" y="375" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#D68910">📊 数据仓库</text>

  <!-- ODS -->
  <rect x="450" y="390" width="100" height="50" rx="5" fill="white" stroke="#F39C12" stroke-width="1.5"/>
  <text x="500" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">ODS 层</text>
  <text x="500" y="420" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">原始数据 5 表</text>

  <!-- DWD -->
  <rect x="570" y="390" width="100" height="50" rx="5" fill="white" stroke="#F39C12" stroke-width="1.5"/>
  <text x="620" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">DWD 层</text>
  <text x="620" y="420" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">清洗标准化 5 表</text>

  <!-- DWS -->
  <rect x="690" y="390" width="100" height="50" rx="5" fill="white" stroke="#F39C12" stroke-width="1.5"/>
  <text x="740" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">DWS 层</text>
  <text x="740" y="420" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">轻度聚合 6 表</text>

  <!-- ADS -->
  <rect x="810" y="390" width="100" height="50" rx="5" fill="white" stroke="#F39C12" stroke-width="1.5"/>
  <text x="860" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">ADS 层</text>
  <text x="860" y="420" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">报表指标 8 表</text>

  <!-- Data Flow Arrows in DW -->
  <line x1="550" y1="415" x2="565" y2="415" stroke="#F39C12" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="670" y1="415" x2="685" y2="415" stroke="#F39C12" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="790" y1="415" x2="805" y2="415" stroke="#F39C12" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- External Services -->
  <rect x="50" y="550" width="900" height="70" rx="10" fill="url(#extGrad)" stroke="#9B59B6" stroke-width="2"/>
  <text x="75" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8E44AD">🌐 外部服务</text>

  <rect x="350" y="580" width="200" height="30" rx="5" fill="white" stroke="#9B59B6" stroke-width="1.5"/>
  <text x="450" y="600" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">阿里云百炼 Qwen3.5-Plus</text>

  <rect x="600" y="580" width="150" height="30" rx="5" fill="white" stroke="#9B59B6" stroke-width="1.5"/>
  <text x="675" y="600" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Docker 容器</text>

  <!-- Connection Arrows -->
  <!-- User to App -->
  <line x1="200" y1="150" x2="200" y2="165" stroke="#4A90D9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="150" x2="450" y2="165" stroke="#4A90D9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="150" x2="700" y2="165" stroke="#4A90D9" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- App to Data -->
  <line x1="500" y1="295" x2="500" y2="305" stroke="#E67E22" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- MySQL to ODS -->
  <line x1="210" y1="380" x2="445" y2="415" stroke="#1ABC9C" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- AI Service to External -->
  <line x1="625" y1="250" x2="625" y2="545" stroke="#9B59B6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <rect x="750" y="480" width="160" height="50" rx="5" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="760" y="500" font-family="Arial, sans-serif" font-size="10" fill="#666">→ 数据流向</text>
  <line x1="760" y1="510" x2="780" y2="510" stroke="#4A90D9" stroke-width="2"/>
  <text x="760" y="525" font-family="Arial, sans-serif" font-size="10" fill="#666">- - - API 调用</text>
  <line x1="840" y1="522" x2="860" y2="522" stroke="#9B59B6" stroke-width="2" stroke-dasharray="3,3"/>
</svg>
