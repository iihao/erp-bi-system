<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="linear-gradient(135deg, #667eea 0%, #764ba2 100%)"/>

  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#bgGrad)"/>

  <!-- Login Box -->
  <rect x="350" y="150" width="300" height="300" rx="15" fill="white" stroke="#dee2e6" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="200" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">AI数据融合 管理系统</text>
  <text x="500" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#6c757d">用户登录</text>

  <!-- Username Field -->
  <rect x="380" y="255" width="240" height="40" rx="5" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="395" y="270" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">用户名</text>
  <text x="395" y="288" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">admin</text>

  <!-- Password Field -->
  <rect x="380" y="310" width="240" height="40" rx="5" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="395" y="325" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">密码</text>
  <text x="395" y="343" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">••••••••</text>

  <!-- Login Button -->
  <rect x="380" y="370" width="240" height="45" rx="8" fill="url(#btnGrad)"/>
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="380" y="370" width="240" height="45" rx="8" fill="#3498db"/>
  <text x="500" y="398" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">登 录</text>

  <!-- Footer Links -->
  <text x="500" y="445" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c757d">忘记密码？ | 联系我们</text>

  <!-- Logo/Icon placeholder -->
  <circle cx="500" cy="120" r="35" fill="white" opacity="0.9"/>
  <text x="500" y="128" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#3498db">📊</text>

  <!-- Placeholder Text -->
  <text x="500" y="570" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.7)">
    截图占位符 - 请访问 http://localhost:3000/login 获取实际截图
  </text>
</svg>
