<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#f8f9fa"/>

  <!-- Header -->
  <rect width="1000" height="50" fill="#2c3e50"/>
  <text x="30" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">AI数据融合平台</text>
  <text x="900" y="32" font-family="Arial, sans-serif" font-size="14" fill="#bdc3c7">管理员</text>

  <!-- KPI Cards -->
  <rect x="30" y="70" width="210" height="100" rx="8" fill="white" stroke="#dee2e6"/>
  <rect x="30" y="70" width="5" height="100" rx="2" fill="#3498db"/>
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">总销售额</text>
  <text x="50" y="135" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">¥1,234,567</text>
  <text x="200" y="135" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">↑ 12.5%</text>

  <rect x="260" y="70" width="210" height="100" rx="8" fill="white" stroke="#dee2e6"/>
  <rect x="260" y="70" width="5" height="100" rx="2" fill="#e74c3c"/>
  <text x="280" y="95" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">总订单数</text>
  <text x="280" y="135" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">8,520</text>
  <text x="430" y="135" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">↑ 8.3%</text>

  <rect x="490" y="70" width="210" height="100" rx="8" fill="white" stroke="#dee2e6"/>
  <rect x="490" y="70" width="5" height="100" rx="2" fill="#f39c12"/>
  <text x="510" y="95" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">客户总数</text>
  <text x="510" y="135" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">1,256</text>
  <text x="660" y="135" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">↑ 5.2%</text>

  <rect x="720" y="70" width="210" height="100" rx="8" fill="white" stroke="#dee2e6"/>
  <rect x="720" y="70" width="5" height="100" rx="2" fill="#9b59b6"/>
  <text x="740" y="95" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">产品总数</text>
  <text x="740" y="135" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">3,450</text>
  <text x="890" y="135" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">↑ 3.1%</text>

  <!-- Charts Area -->
  <rect x="30" y="190" width="500" height="250" rx="8" fill="white" stroke="#dee2e6"/>
  <text x="50" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">销售趋势图</text>
  <text x="500" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#adb5bd">折线图占位 - 显示近 30 天销售趋势</text>

  <rect x="550" y="190" width="420" height="120" rx="8" fill="white" stroke="#dee2e6"/>
  <text x="570" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">产品排行 TOP5</text>
  <text x="760" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#adb5bd">柱状图占位</text>

  <rect x="550" y="325" width="420" height="115" rx="8" fill="white" stroke="#dee2e6"/>
  <text x="570" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">品类占比</text>
  <text x="760" y="400" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#adb5bd">饼图占位</text>

  <!-- Placeholder Text -->
  <text x="500" y="570" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#adb5bd">
    截图占位符 - 请访问 http://localhost:3000/dashboard 获取实际截图
  </text>
</svg>
