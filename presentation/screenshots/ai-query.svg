<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#f8f9fa"/>

  <!-- Header -->
  <rect width="1000" height="50" fill="#2c3e50"/>
  <text x="30" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">AI 智能问数</text>

  <!-- Input Area -->
  <rect x="50" y="80" width="900" height="100" rx="10" fill="white" stroke="#3498db" stroke-width="2"/>
  <text x="70" y="110" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">请输入您的问题：</text>

  <rect x="70" y="125" width="780" height="45" rx="5" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="85" y="153" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">上个月销售额最高的产品是什么？</text>

  <rect x="860" y="125" width="80" height="45" rx="5" fill="#3498db"/>
  <text x="900" y="153" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">查询</text>

  <!-- Generated SQL -->
  <rect x="50" y="200" width="900" height="120" rx="10" fill="#2c3e50"/>
  <text x="70" y="225" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">-- 自动生成的 SQL:</text>
  <text x="70" y="245" font-family="Courier New, monospace" font-size="11" fill="#ecf0f1">SELECT p.product_name, SUM(oi.quantity * oi.price) as total_sales</text>
  <text x="70" y="265" font-family="Courier New, monospace" font-size="11" fill="#ecf0f1">FROM ods_order_items oi</text>
  <text x="70" y="285" font-family="Courier New, monospace" font-size="11" fill="#ecf0f1">JOIN ods_products p ON oi.product_id = p.product_id</text>
  <text x="70" y="305" font-family="Courier New, monospace" font-size="11" fill="#ecf0f1">WHERE o.order_date >= DATE_SUB(CURDATE(), INTERVAL 1 MONTH)</text>
  <text x="70" y="325" font-family="Courier New, monospace" font-size="11" fill="#ecf0f1">GROUP BY p.product_name ORDER BY total_sales DESC LIMIT 1;</text>

  <!-- Result Table -->
  <rect x="50" y="340" width="900" height="150" rx="10" fill="white" stroke="#dee2e6"/>
  <text x="70" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">查询结果</text>

  <rect x="70" y="385" width="860" height="35" rx="3" fill="#3498db"/>
  <text x="150" y="408" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">产品名称</text>
  <text x="500" y="408" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">销售总额</text>

  <rect x="70" y="425" width="860" height="55" rx="3" fill="#f8f9fa"/>
  <text x="150" y="455" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">iPhone 15 Pro Max</text>
  <text x="500" y="455" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">¥ 256,789</text>

  <!-- Placeholder Text -->
  <text x="500" y="570" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#adb5bd">
    截图占位符 - 请访问 http://localhost:3000/ai-query 获取实际截图
  </text>
</svg>
